services:
  api:
    build:
      context: .
      args:
        # Default changed to true — false produces an image where every ML
        # predictor fails with ImportError and only MockPredictor works.
        INSTALL_ML: ${INSTALL_ML:-true}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./weights:/app/weights:ro
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped