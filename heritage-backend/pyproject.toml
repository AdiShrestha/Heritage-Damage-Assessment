[project]
name = "heritage-backend"
version = "0.1.0"
description = "Heritage temple damage assessment API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # ── Web framework ─────────────────────────────────────────────────────────
    "fastapi>=0.111.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29.0",
    # ── Image / numeric ───────────────────────────────────────────────────────
    "numpy>=1.26.0",
    "pillow>=10.3.0",
    "scipy>=1.13.0",
    # ── Logging ───────────────────────────────────────────────────────────────
    "python-json-logger>=2.0.7",
    # ── History DB ───────────────────────────────────────────────────────────
    # Required for async SQLite prediction history (history_service.py).
    # Lightweight — no system libraries needed.
    "aiosqlite>=0.19.0",
    # ── ONNX / YOLO shared ───────────────────────────────────────────────────
    "timm>=1.0.27",
    "ultralytics>=8.4.65",
]

[project.optional-dependencies]
# ── ML inference stack ────────────────────────────────────────────────────────
# Install with: pip install ".[inference]"
inference = [
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    # torch-ema is required for ResNet50 weight loading (EMA checkpoint format).
    # Without it ResNetPredictor falls back gracefully, but EMA averaging is lost.
    "torch-ema>=0.3.0",
    "timm>=1.0.27",
]

# ── Object detection (YOLO) ───────────────────────────────────────────────────
detection = [
    "heritage-backend[inference]",
    "ultralytics>=8.4.65",
]

# ── Explainability (Grad-CAM) ─────────────────────────────────────────────────
# pytorch-grad-cam kept here for completeness; the predictor also has a
# built-in hook-based Grad-CAM that works without this package.
explainability = [
    "heritage-backend[inference]",
    "grad-cam>=1.5.0"
]

# ── Development ───────────────────────────────────────────────────────────────
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]

# ── Everything ────────────────────────────────────────────────────────────────
all = [
    "heritage-backend[inference,detection,explainability,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"